<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Батальйон підтримки 15-ї оперативної бригади</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    position:relative;
}

/* ================= VIDEO ================= */

#bgVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    
}

/* ================= OVERLAY ================= */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 2; /* Було -2, стало 2 */
    
}

/* ================= CONTENT ================= */

.content{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:white;

    padding:20px;
}
/* ================= TITLE ================= */

.title{
    text-transform:uppercase;

    font-weight:800;

    line-height:1.1;

    letter-spacing:0.08em;

    font-size:7;

    text-shadow:
        0 0 25px rgba(0,0,0,.9),
        0 0 50px rgba(0,0,0,.7);

    margin-bottom:28px;
}

/* ================= LOGO ================= */

.logo{
    width:min(22vw,220px);
    max-width:220px;
    min-width:120px;

    filter:
        drop-shadow(0 0 20px rgba(0,0,0,.8))
        drop-shadow(0 0 50px rgba(0,0,0,.5));

    margin-bottom:30px;
}

/* ================= CLOCK ================= */

.clock{
    font-size:5rem;

    font-weight:800;

    letter-spacing:0.08em;

    text-shadow:
        0 0 25px rgba(0,0,0,.9);

    margin-bottom:14px;

    font-variant-numeric:
        tabular-nums;
}

/* ================= DATE ================= */

.date{
    font-size:1.5rem;

    opacity:.95;

    letter-spacing:.08em;

    margin-bottom:30px;

    text-shadow:
        0 0 20px rgba(0,0,0,.8);
}

/* ================= DAYS ================= */

.days-card{

    padding:
    22px
    36px;

    text-shadow:
        0 0 20px rgba(0,0,0,.8);
}

.days-title{
    text-transform:uppercase;

    letter-spacing:.12em;

    opacity:.9;

    font-size:1.5rem;

    margin-bottom:10px;
}

.days-number{
    font-size:5rem;

    font-weight:800;

    line-height:1;

    margin-bottom:10px;
}

.days-sub{
    opacity:.8;
    font-size:2.5rem;
}

/* ================= MOBILE ================= */

@media (max-width:768px){

    .title{
        margin-bottom:20px;
    }

    .logo{
        margin-bottom:22px;
    }

    .clock{
        margin-bottom:10px;
    }

    .date{
        margin-bottom:22px;
    }

    .days-card{
        padding:18px 22px;
    }
}
</style>
</head>
<body>

<video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline
    preload="auto">

    <source src="media/flagloopanimatio.mp4" type="video/mp4">
    <source src="media/flagloopanimatio.webm" type="video/webm">

</video>

<div class="overlay"></div>

<div class="content">

    <div class="title">
        БАТАЛЬЙОН ПІДТРИМКИ<br>
        15-Ї ОПЕРАТИВНОЇ БРИГАДИ
    </div>

    <img
        src="media/SupportBattalionLogo.png"
        class="logo"
        alt="Логотип">

    <div
        class="clock"
        id="clock">
        00:00:00
    </div>

    <div
        class="date"
        id="date">
    </div>

    <div class="days-card">

        <div class="days-title">
            ДНІВ ПОВНОМАСШТАБНОЇ ВІЙНИ
        </div>

        <div
            class="days-number"
            id="days">
            0
        </div>

        <div class="days-sub">
            з 24 лютого 2022 року
        </div>

    </div>

</div>

<script>

const clockEl =
document.getElementById("clock");

const dateEl =
document.getElementById("date");

const daysEl =
document.getElementById("days");

const weekdays = [
"неділя",
"понеділок",
"вівторок",
"середа",
"четвер",
"п’ятниця",
"субота"
];

const months = [
"січня",
"лютого",
"березня",
"квітня",
"травня",
"червня",
"липня",
"серпня",
"вересня",
"жовтня",
"листопада",
"грудня"
];

const warStart =
new Date(
"2022-02-24T00:00:00+02:00"
);

function updateClock(){

    const now =
    new Date();

    clockEl.textContent =
        String(now.getHours()).padStart(2,"0")
        + ":" +
        String(now.getMinutes()).padStart(2,"0")
        + ":" +
        String(now.getSeconds()).padStart(2,"0");

    dateEl.textContent =
        weekdays[now.getDay()]
        + ", "
        + now.getDate()
        + " "
        + months[now.getMonth()]
        + " "
        + now.getFullYear();

    const days =
    Math.floor(
        (now - warStart)
        /
        86400000
    );

    daysEl.textContent =
    days.toLocaleString("uk-UA");
}

updateClock();
setInterval(updateClock,1000);

/* страховка для autoplay */

const video =
document.getElementById("bgVideo");

video.play().catch(()=>{
    console.log("Autoplay blocked");
});

    /* Примусовий запуск відео на випадок блокування браузером */
window.addEventListener("DOMContentLoaded", () => {
    const video = document.getElementById("bgVideo");
    if (video) {
        video.muted = true; // На всякий випадок дублюємо програмно
        video.play().catch(error => {
            console.log("Автозапуск заблоковано браузером, очікуємо взаємодії:", error);
            
            // Якщо браузер жорстко заблокував автозапуск, воно запуститься від першого кліку/дотику
            const resumeVideo = () => {
                video.play();
                window.removeEventListener("click", resumeVideo);
                window.removeEventListener("touchstart", resumeVideo);
            };
            window.addEventListener("click", resumeVideo);
            window.addEventListener("touchstart", resumeVideo);
        });
    }
});
    

</script>

</body>
</html>
